name: Weekly Seed & Refresh

# This repo is intentionally PUBLIC and contains NO source code — only this
# workflow file. That's the whole point: GitHub Actions minutes are free and
# unlimited for workflows defined in public repos, even when they check out
# and execute code from a private repo (billing is based on where the
# workflow FILE lives, not what it checks out). The real source lives in the
# private repo chrszhu/lol and is pulled onto the runner at execution time,
# then discarded — nothing from it is ever committed or published here.
#
# WEEKLY SCHEDULE (changed from daily to stay within CockroachDB free tier):
# - NA1: Sunday 06:00 UTC
# - KR:  Sunday 08:00 UTC
#
# With gap-fill disabled (GAP_FILL_DISABLED=1 in seed_pipeline.py) and weekly
# frequency, RU usage should stay well within the 50M/month free tier.
#
# Secrets required in THIS repo's settings (Settings → Secrets → Actions):
#   PRIVATE_REPO_PAT — fine-grained PAT, scoped ONLY to chrszhu/lol,
#                      with "Contents: Read and write" permission
#                      (write is needed for the cache-warm commit)
#   DATABASE_URL     — same value as in chrszhu/lol
#   RIOT_API_KEY     — same value as in chrszhu/lol

on:
  schedule:
    - cron: "0 6 * * 0"    # Weekly Sunday 06:00 UTC — NA1 (primary)
    - cron: "0 8 * * 0"    # Weekly Sunday 08:00 UTC — KR  (primary)
    - cron: "0 12 * * 0"   # Weekly Sunday 12:00 UTC — NA1 (retry / overflow)
    - cron: "0 14 * * 0"   # Weekly Sunday 14:00 UTC — KR  (retry / overflow)
    # Retry runs 6h after primary. If primary finished all players, retry finds
    # nothing stale and exits in ~2 min. If primary was cut short (e.g. Riot API
    # was slow), retry picks up the remaining players automatically.
    # Skips rates/matchups/build-order — those were already computed by the primary.
  workflow_dispatch:
    inputs:
      region:
        description: "Region to seed (na1, kr, or both)"
        required: false
        default: "both"
      skip_refresh:
        description: "Skip player match refresh (true/false)"
        required: false
        default: "false"
      skip_matchups:
        description: "Skip matchup aggregation (true/false)"
        required: false
        default: "false"

jobs:
  check-ru-budget-pre:
    name: Pre-check RU budget (block if ≥75%)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r match-analytics-fastapi/requirements.txt \
                      -r match-analytics-fastapi/requirements-server.txt

      - name: Check RU budget — abort seeding if ≥ 75%
        working-directory: match-analytics-fastapi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python - <<'EOF'
          import asyncio, sys
          sys.path.insert(0, ".")
          import db, seed_pipeline

          async def main():
              await db.init_pool()
              usage = await seed_pipeline.get_monthly_ru_usage()
              pct   = usage.get("budget_used_pct", 0)
              ru    = usage.get("ru_estimate", 0)
              matches = usage.get("matches_this_month", 0)
              print(f"📊 Pre-seed RU check: {pct:.1f}%  ({ru:,} / 50,000,000 RUs, {matches:,} matches this month)")

              if pct >= 90:
                  print(f"🚨 CRITICAL: {pct:.1f}% used — seeding blocked to protect the free tier.")
                  sys.exit(1)
              elif pct >= 75:
                  print(f"⚠️  WARNING: {pct:.1f}% used — seeding blocked. CockroachDB should have emailed you at 75%.")
                  sys.exit(1)
              else:
                  print(f"✅ RU budget OK ({pct:.1f}%) — proceeding with seeding.")

          asyncio.run(main())
          EOF

  seed-na1:
    name: Refresh NA1 players
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    needs: check-ru-budget-pre
    if: >-
      github.event.schedule == '0 6 * * 0' ||
      github.event.schedule == '0 12 * * 0' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.region == 'na1' || github.event.inputs.region == 'both')

    steps:
      - name: Checkout private source repo (chrszhu/lol)
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r match-analytics-fastapi/requirements.txt \
                      -r match-analytics-fastapi/requirements-server.txt

      - name: Run weekly seed — NA1
        working-directory: match-analytics-fastapi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GAP_FILL_DISABLED: "1"
        run: |
          # Retry run (12:00 UTC) skips computed steps — already done by primary (06:00)
          IS_RETRY=${{ github.event.schedule == '0 12 * * 0' }}
          python run_weekly_refresh.py \
            --region na1 \
            ${{ github.event.inputs.skip_refresh == 'true' && '--skip-refresh' || '' }} \
            ${{ github.event.inputs.skip_matchups == 'true' && '--skip-matchups' || '' }} \
            $([ "$IS_RETRY" = "true" ] && echo "--skip-rates --skip-matchups --skip-build-order" || echo "")

  seed-kr:
    name: Refresh KR players
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: check-ru-budget-pre
    if: >-
      github.event.schedule == '0 8 * * 0' ||
      github.event.schedule == '0 14 * * 0' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.region == 'kr' || github.event.inputs.region == 'both')

    steps:
      - name: Checkout private source repo (chrszhu/lol)
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r match-analytics-fastapi/requirements.txt \
                      -r match-analytics-fastapi/requirements-server.txt

      - name: Run weekly seed — KR (skip rates/build-order, NA computes them)
        working-directory: match-analytics-fastapi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GAP_FILL_DISABLED: "1"
        run: |
          # KR always skips rates/matchups/build-order (NA handles those)
          python run_weekly_refresh.py \
            --region kr \
            --skip-rates \
            --skip-matchups \
            --skip-build-order \
            ${{ github.event.inputs.skip_refresh == 'true' && '--skip-refresh' || '' }}

  # Warm CDN cache after weekly refresh
  warm-cache:
    name: Warm CDN cache & save fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [seed-na1, seed-kr]
    if: always() && (needs.seed-na1.result == 'success' || needs.seed-kr.result == 'success')

    steps:
      - name: Checkout private source repo (chrszhu/lol)
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: pip install httpx

      - name: Warm cache and save JSON fallback
        working-directory: match-analytics-fastapi
        env:
          BASE_URL: "https://lolitembuilds.vercel.app"
        run: |
          python warm_cache.py \
            --base-url "$BASE_URL" \
            --output-dir ./static-data

      - name: Commit and push static data (to chrszhu/lol)
        run: |
          cd match-analytics-fastapi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add static-data/

          if git diff --staged --quiet; then
            echo "No changes to static data"
          else
            git commit -m "chore: update static fallback data [skip ci]"
            git push
            echo "✅ Static data committed and pushed to chrszhu/lol"
          fi

  check-ru-budget:
    name: Check RU budget (warn at 75%)
    runs-on: ubuntu-latest
    needs: [seed-na1, seed-kr]
    # Run even if seed jobs failed — we still want the RU alert
    if: always() && (needs.seed-na1.result != 'skipped' || needs.seed-kr.result != 'skipped')

    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r match-analytics-fastapi/requirements.txt \
                      -r match-analytics-fastapi/requirements-server.txt

      - name: Check monthly RU usage — fail if > 75%
        working-directory: match-analytics-fastapi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python - <<'EOF'
          import asyncio, sys
          sys.path.insert(0, ".")
          import db, seed_pipeline

          async def main():
              await db.init_pool()
              usage = await seed_pipeline.get_monthly_ru_usage()
              pct = usage.get("budget_used_pct", 0)
              matches = usage.get("matches_this_month", 0)
              ru = usage.get("ru_estimate", 0)
              print(f"📊 Monthly RU usage: {pct:.1f}%  ({ru:,} / 50,000,000 RUs, {matches:,} matches)")

              if pct >= 90:
                  print(f"🚨 CRITICAL: RU usage at {pct:.1f}% — database will be disabled soon!")
                  sys.exit(1)
              elif pct >= 75:
                  print(f"⚠️  WARNING: RU usage at {pct:.1f}% — approaching free-tier limit.")
                  print("CockroachDB should have already emailed you at 75%.")
                  sys.exit(1)  # Fail job → triggers GitHub email notification
              else:
                  print(f"✅ RU usage is healthy at {pct:.1f}%")

          asyncio.run(main())
          EOF

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [seed-na1, seed-kr]
    if: failure()
    steps:
      - name: Create failure issue (in this orchestrator repo)
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `❌ Weekly seed cron failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `The weekly seed workflow failed (runs against chrszhu/lol).\n\n**Run URL:** ${runUrl}\n**Schedule:** ${context.payload.schedule || 'manual'}\n\nPlease check the logs and RU usage.`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cron-failure',
              per_page: 5
            });

            const today = new Date().toISOString().split('T')[0];
            const existingIssue = issues.data.find(i => i.title.includes(today));

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another failure:\n${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['cron-failure']
              });
            }
