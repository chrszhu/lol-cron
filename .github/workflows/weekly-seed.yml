name: Weekly Seed & Refresh

# This repo is intentionally PUBLIC and contains NO source code — only this
# workflow file. That's the whole point: GitHub Actions minutes are free and
# unlimited for workflows defined in public repos, even when they check out
# and execute code from a private repo (billing is based on where the
# workflow FILE lives, not what it checks out). The real source lives in the
# private repo chrszhu/lol and is pulled onto the runner at execution time,
# then discarded — nothing from it is ever committed or published here.
#
# WEEKLY SCHEDULE (changed from daily to stay within CockroachDB free tier):
# - NA1: Sunday 06:00 UTC
# - KR:  Sunday 08:00 UTC
#
# With gap-fill disabled (GAP_FILL_DISABLED=1 in seed_pipeline.py) and weekly
# frequency, RU usage should stay well within the 50M/month free tier.
#
# Secrets required in THIS repo's settings (Settings → Secrets → Actions):
#   PRIVATE_REPO_PAT — fine-grained PAT, scoped ONLY to chrszhu/lol,
#                      with "Contents: Read and write" permission
#                      (write is needed for the cache-warm commit)
#   DATABASE_URL     — same value as in chrszhu/lol
#   RIOT_API_KEY     — same value as in chrszhu/lol

on:
  schedule:
    - cron: "0 6 * * 0"    # Weekly Sunday 06:00 UTC — NA1
    - cron: "0 8 * * 0"    # Weekly Sunday 08:00 UTC — KR
  workflow_dispatch:
    inputs:
      region:
        description: "Region to seed (na1, kr, or both)"
        required: false
        default: "both"
      skip_refresh:
        description: "Skip player match refresh (true/false)"
        required: false
        default: "false"
      skip_matchups:
        description: "Skip matchup aggregation (true/false)"
        required: false
        default: "false"

jobs:
  seed-na1:
    name: Refresh NA1 players
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours — enough for full weekly refresh
    if: >-
      github.event.schedule == '0 6 * * 0' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.region == 'na1' || github.event.inputs.region == 'both')

    steps:
      - name: Checkout private source repo (chrszhu/lol)
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r match-analytics-fastapi/requirements.txt \
                      -r match-analytics-fastapi/requirements-server.txt

      - name: Run weekly seed — NA1
        working-directory: match-analytics-fastapi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GAP_FILL_DISABLED: "1"  # Explicitly disable gap-fill to save RUs
        run: |
          python run_weekly_refresh.py \
            --region na1 \
            ${{ github.event.inputs.skip_refresh == 'true' && '--skip-refresh' || '' }} \
            ${{ github.event.inputs.skip_matchups == 'true' && '--skip-matchups' || '' }}

  seed-kr:
    name: Refresh KR players
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event.schedule == '0 8 * * 0' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.region == 'kr' || github.event.inputs.region == 'both')

    steps:
      - name: Checkout private source repo (chrszhu/lol)
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r match-analytics-fastapi/requirements.txt \
                      -r match-analytics-fastapi/requirements-server.txt

      - name: Run weekly seed — KR (skip rates/build-order, NA computes them)
        working-directory: match-analytics-fastapi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GAP_FILL_DISABLED: "1"
        run: |
          python run_weekly_refresh.py \
            --region kr \
            --skip-rates \
            --skip-matchups \
            --skip-build-order \
            ${{ github.event.inputs.skip_refresh == 'true' && '--skip-refresh' || '' }}

  # Warm CDN cache after weekly refresh
  warm-cache:
    name: Warm CDN cache & save fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [seed-na1, seed-kr]
    if: always() && (needs.seed-na1.result == 'success' || needs.seed-kr.result == 'success')

    steps:
      - name: Checkout private source repo (chrszhu/lol)
        uses: actions/checkout@v4
        with:
          repository: chrszhu/lol
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: match-analytics-fastapi/requirements.txt

      - name: Install dependencies
        run: pip install httpx

      - name: Warm cache and save JSON fallback
        working-directory: match-analytics-fastapi
        env:
          BASE_URL: "https://lolitembuilds.vercel.app"
        run: |
          python warm_cache.py \
            --base-url "$BASE_URL" \
            --output-dir ./static-data

      - name: Commit and push static data (to chrszhu/lol)
        run: |
          cd match-analytics-fastapi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add static-data/

          if git diff --staged --quiet; then
            echo "No changes to static data"
          else
            git commit -m "chore: update static fallback data [skip ci]"
            git push
            echo "✅ Static data committed and pushed to chrszhu/lol"
          fi

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [seed-na1, seed-kr]
    if: failure()
    steps:
      - name: Create failure issue (in this orchestrator repo)
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `❌ Weekly seed cron failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `The weekly seed workflow failed (runs against chrszhu/lol).\n\n**Run URL:** ${runUrl}\n**Schedule:** ${context.payload.schedule || 'manual'}\n\nPlease check the logs and RU usage.`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cron-failure',
              per_page: 5
            });

            const today = new Date().toISOString().split('T')[0];
            const existingIssue = issues.data.find(i => i.title.includes(today));

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another failure:\n${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['cron-failure']
              });
            }
